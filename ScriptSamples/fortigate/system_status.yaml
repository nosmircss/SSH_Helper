---
# FortiGate system status gathering script

name: FortiGate System Status
description: Gathers system status, resource usage, and license info

steps:
  # Get system status
  - send:
      command: get system status
      capture: status
      suppress: true

  # Extract version info
  - extract:
      from: status
      pattern: 'Version:\s*(.+?)$'
      into: version

  - extract:
      from: status
      pattern: 'Hostname:\s*(\S+)'
      into: hostname

  - extract:
      from: status
      pattern: 'Serial-Number:\s*(\S+)'
      into: serial

  - print:
      message: "========== FortiGate Status =========="
  - print:
      message: "Hostname: ${hostname}"
  - print:
      message: "Serial: ${serial}"
  - print:
      message: "Version: ${version}"

  # Get system performance
  - send:
      command: get system performance status
      capture: perf

  # Extract CPU and memory
  - extract:
      from: perf
      pattern: 'CPU states:\s*(\d+)%'
      into: cpu_usage

  - extract:
      from: perf
      pattern: 'Memory:\s*(\d+)%'
      into: mem_usage

  - print:
      message: " "
  - print:
      message: "=== Resource Usage ==="
  - print:
      message: "CPU: ${cpu_usage}%"
  - print:
      message: "Memory: ${mem_usage}%"

  # Get session count
  - send:
      command: get system session status
      capture: sessions

  - extract:
      from: sessions
      pattern: 'active\s+(\d+)'
      into: active_sessions

  - print:
      message: "Active Sessions: ${active_sessions}"

  # Check HA status
  - send:
      command: get system ha status
      capture: ha_status

  - if:
      condition: ha_status matches 'standalone'
      then:
        - print:
            message: "HA Mode: Standalone"
      else:
        - if:
            condition: ha_status matches 'master'
            then:
              - print:
                  message: "HA Mode: Master"
            else:
              - if:
                  condition: ha_status matches 'slave'
                  then:
                    - print:
                        message: "HA Mode: Slave"

  - print:
      message: "======================================"

  - exit:
      status: success
      message: "Status check complete for ${hostname}"
