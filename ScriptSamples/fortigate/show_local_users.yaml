# Simple script to show local users

name: FortiGate Show Local Users
description: Displays the local user accounts configured on the FortiGate

steps:
  - send:
      command: sh user local
      capture: users

  - print:
      message: "Local users displayed above"

  - exit:
      status: success
      message: "User list retrieved"
