---
# Converted from: dudescript/conversation/fortigate/block
# Creates a firewall address object and adds it to a blocking group on FortiGate
#
# Required variables (from CSV grid):
#   ${block}         - IP address to block
#   ${src_interface} - Source interface name
#   ${dst_interface} - Destination interface name

name: FortiGate Block IP
description: Creates address object and adds to blocking group with firewall policy

vars:
  block: ""
  src_interface: "any"
  dst_interface: "any"

steps:
  # Create address object for the blocked IP
  - send:
      command: config firewall address
  - send:
      command: edit GDGBLOCK_${block}
  - send:
      command: set subnet ${block} 255.255.255.255
  - send:
      command: set comment GDG_FSM_BLOCK
  - send:
      command: end

  # Add to address group
  - send:
      command: config firewall addrgrp
  - send:
      command: edit FSM_BLOCK_GROUP
  - send:
      command: append member GDGBLOCK_${block}
  - send:
      command: set comment GDG_BLOCKING_GROUP
  - send:
      command: end

  # Verify block was added to the group
  - send:
      command: sh firewall addrgrp FSM_BLOCK_GROUP
      capture: verify_output

  - if:
      condition: verify_output matches 'GDGBLOCK_${block}'
      then:
        - exit:
            status: success
            message: "Block set (${block}/32)"
      else:
        - exit:
            status: failure
            message: "Block NOT set (${block}/32)"
