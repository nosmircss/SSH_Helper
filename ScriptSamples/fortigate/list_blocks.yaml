---
# Alternative to: dudescript/conversation/fortigate/listblocks
# The original used local shell commands to format output.
# This simplified version just displays the raw group membership.

name: FortiGate List Blocks
description: Shows all IPs currently in the FSM_BLOCK_GROUP

steps:
  # Check if block group exists and show members
  - send:
      command: sh firewall addrgrp FSM_BLOCK_GROUP
      capture: group_info

  - if:
      condition: group_info matches 'entry is not found'
      then:
        - print:
            message: "No blocks found - FSM_BLOCK_GROUP does not exist"
        - exit:
            status: success
            message: "No current blocks"
      else:
        - print:
            message: "========== Current Blocks =========="
        - print:
            message: "${group_info}"
        - print:
            message: "===================================="

        # Try to extract and count members
        - extract:
            from: group_info
            pattern: 'GDGBLOCK_(\S+)'
            into: blocks
            match: all

        - print:
            message: ""
        - print:
            message: "Blocked IPs found:"
        - foreach:
            iterator: ip in blocks
            do:
              - print:
                  message: "  - ${ip}"

        - exit:
            status: success
            message: "Block list retrieved"
