---
# Demonstrates: writefile with csv format, headers, extract, string building
# Scenario: Collect system metrics and export to CSV for spreadsheet analysis

name: Metrics CSV Export
description: Gathers system metrics and exports to CSV format

vars:
  output_file: "C:\\output\\system_metrics.csv"
  write_header: "true"

steps:
  - print:
      message: "Collecting metrics from ${Host_IP}..."

  # Get hostname
  - send:
      command: hostname
      capture: hostname_out
  - extract:
      from: hostname_out
      pattern: '(\S+)'
      into: device_name

  # Get OS info
  - send:
      command: cat /etc/os-release 2>/dev/null | grep PRETTY_NAME | cut -d'"' -f2
      capture: os_out
      on_error: continue
  - set:
      expression: os_name = trim(os_out)

  # Get CPU count
  - send:
      command: nproc
      capture: cpu_count

  # Get memory total (GB)
  - send:
      command: free -g | grep Mem | awk '{print $2}'
      capture: mem_total

  # Get disk usage percentage
  - send:
      command: df -h / | tail -1 | awk '{print $5}' | tr -d '%'
      capture: disk_pct

  # Get load average (1 min)
  - send:
      command: cat /proc/loadavg | awk '{print $1}'
      capture: load_avg

  # Write CSV header on first run (controlled by variable)
  - if:
      condition: write_header == "true"
      then:
        - writefile:
            path: "${output_file}"
            format: csv
            content: ""
            headers: [Timestamp, Host_IP, Hostname, OS, CPUs, Memory_GB, Disk_Pct, Load_1min]
            mode: overwrite
        - print:
            message: "CSV header written"

  # Build CSV row
  - set:
      expression: csv_row = "${_timestamp},${Host_IP},${device_name},${os_name},${cpu_count},${mem_total},${disk_pct},${load_avg}"

  # Append data row
  - writefile:
      path: "${output_file}"
      format: csv
      content: "${csv_row}"
      mode: append

  - print:
      message: "Metrics exported:"
  - print:
      message: "  Host: ${device_name}"
  - print:
      message: "  OS: ${os_name}"
  - print:
      message: "  CPUs: ${cpu_count}"
  - print:
      message: "  Memory: ${mem_total} GB"
  - print:
      message: "  Disk: ${disk_pct}%"
  - print:
      message: "  Load: ${load_avg}"

  - exit:
      status: success
      message: "Metrics exported to CSV"
