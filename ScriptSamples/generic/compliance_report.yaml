---
# Demonstrates: json.merge, json.set, json.keys, multiple extracts, complex conditionals
# Scenario: Run compliance checks and generate detailed JSON report

name: Security Compliance Scan
description: Performs security compliance checks and generates JSON report

vars:
  report_dir: "C:\\compliance\\reports"

steps:
  - print:
      message: "=== Security Compliance Scan: ${Host_IP} ==="

  # Initialize base report structure
  - set:
      expression: defaults = json("scan_version", "1.0", "framework", "CIS-Benchmark")
  - set:
      expression: host_info = json("ip", ${Host_IP}, "port", ${port})

  # Merge to create initial report
  - set:
      expression: report = json.merge(defaults, host_info)

  # Add metadata
  - set:
      expression: report = json.set(report, "metadata.timestamp", ${_timestamp})
  - set:
      expression: report = json.set(report, "metadata.scanner", "SSH Helper")

  # Initialize check counters
  - set:
      expression: passed = 0
  - set:
      expression: failed = 0
  - set:
      expression: skipped = 0

  # ----- CHECK 1: SSH Root Login -----
  - send:
      command: grep -E "^PermitRootLogin" /etc/ssh/sshd_config 2>/dev/null || echo "not found"
      capture: ssh_root
      on_error: continue

  - if:
      condition: ssh_root contains "no"
      then:
        - set:
            expression: check1_status = "PASS"
        - set:
            expression: passed = passed + 1
      else:
        - if:
            condition: ssh_root contains "not found"
            then:
              - set:
                  expression: check1_status = "SKIP"
              - set:
                  expression: skipped = skipped + 1
            else:
              - set:
                  expression: check1_status = "FAIL"
              - set:
                  expression: failed = failed + 1

  - set:
      expression: report = json.set(report, "checks.ssh_root_login.status", ${check1_status})
  - set:
      expression: report = json.set(report, "checks.ssh_root_login.finding", ${ssh_root})

  # ----- CHECK 2: Password Authentication -----
  - send:
      command: grep -E "^PasswordAuthentication" /etc/ssh/sshd_config 2>/dev/null || echo "yes"
      capture: ssh_passwd
      on_error: continue

  - if:
      condition: ssh_passwd contains "no"
      then:
        - set:
            expression: check2_status = "PASS"
        - set:
            expression: passed = passed + 1
      else:
        - set:
            expression: check2_status = "FAIL"
        - set:
            expression: failed = failed + 1

  - set:
      expression: report = json.set(report, "checks.password_auth.status", ${check2_status})

  # ----- CHECK 3: Firewall Status -----
  - send:
      command: systemctl is-active firewalld 2>/dev/null || systemctl is-active ufw 2>/dev/null || echo "inactive"
      capture: fw_status
      on_error: continue

  - if:
      condition: fw_status contains "active"
      then:
        - set:
            expression: check3_status = "PASS"
        - set:
            expression: passed = passed + 1
      else:
        - set:
            expression: check3_status = "FAIL"
        - set:
            expression: failed = failed + 1

  - set:
      expression: report = json.set(report, "checks.firewall_active.status", ${check3_status})

  # ----- CHECK 4: Unattended Upgrades -----
  - send:
      command: dpkg -l unattended-upgrades 2>/dev/null | grep -q "^ii" && echo "installed" || echo "not installed"
      capture: auto_update
      on_error: continue

  - if:
      condition: auto_update contains "installed"
      then:
        - set:
            expression: check4_status = "PASS"
        - set:
            expression: passed = passed + 1
      else:
        - set:
            expression: check4_status = "INFO"
        - set:
            expression: skipped = skipped + 1

  - set:
      expression: report = json.set(report, "checks.auto_updates.status", ${check4_status})

  # ----- Build Summary -----
  - set:
      expression: total = passed + failed + skipped
  - set:
      expression: report = json.set(report, "summary.total_checks", ${total})
  - set:
      expression: report = json.set(report, "summary.passed", ${passed})
  - set:
      expression: report = json.set(report, "summary.failed", ${failed})
  - set:
      expression: report = json.set(report, "summary.skipped", ${skipped})

  # Determine overall compliance
  - if:
      condition: failed == 0
      then:
        - set:
            expression: overall = "COMPLIANT"
      else:
        - if:
            condition: failed <= 1
            then:
              - set:
                  expression: overall = "PARTIAL"
            else:
              - set:
                  expression: overall = "NON-COMPLIANT"

  - set:
      expression: report = json.set(report, "summary.overall", ${overall})

  # Get check names for display
  - set:
      expression: check_names = json.keys(report, "checks")

  - print:
      message: " "
  - print:
      message: "Results:"
  - foreach:
      iterator: check in check_names
      do:
        - set:
            expression: status = json.get(report, "checks.${check}.status")
        - print:
            message: "  ${check}: ${status}"

  - print:
      message: " "
  - print:
      message: "Summary: ${passed} passed, ${failed} failed, ${skipped} skipped"
  - print:
      message: "Overall: ${overall}"

  # Write report file
  - writefile:
      path: "${report_dir}\\${Host_IP}_compliance.json"
      format: json
      content: "${report}"
      pretty: true

  - log:
      message: "Compliance report saved"
      level: success

  # Update grid column
  - updatecolumn:
      column: compliance
      value: ${overall}

  - exit:
      status: success
      message: "Compliance scan complete: ${overall}"
