---
# Demonstrates: json(), json.set, json.merge, writefile (json format), dot notation
# Scenario: Collect device info and generate a structured JSON report

name: JSON Inventory Report
description: Collects device data and writes a JSON inventory file

steps:
  # Gather basic system info
  - send:
      command: hostname
      capture: hostname_output

  - extract:
      from: hostname_output
      pattern: '(\S+)'
      into: device_name

  - send:
      command: uname -r
      capture: kernel_output

  - extract:
      from: kernel_output
      pattern: '(\S+)'
      into: kernel_version

  # Build nested JSON using dot notation
  - set:
      expression: report.device.name = ${device_name}
  - set:
      expression: report.device.ip = ${Host_IP}
  - set:
      expression: report.device.port = ${port}
  - set:
      expression: report.system.kernel = ${kernel_version}
  - set:
      expression: report.metadata.collected_at = ${_timestamp}
  - set:
      expression: report.metadata.collected_by = "SSH Helper"

  # Get interface count
  - send:
      command: ip link show | grep -c "^[0-9]"
      capture: iface_count
      on_error: continue

  - extract:
      from: iface_count
      pattern: '(\d+)'
      into: interface_count

  # Add interface count to report
  - set:
      expression: report.network.interface_count = ${interface_count}

  # Write individual device JSON file
  - writefile:
      path: "C:\\output\\inventory\\${Host_IP}.json"
      format: json
      content: "${report}"
      pretty: true

  - log:
      message: "Inventory saved for ${device_name} (${Host_IP})"
      level: success

  - exit:
      status: success
      message: "JSON inventory report generated"
