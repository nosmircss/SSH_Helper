---
# Demonstrates: readfile, foreach, writefile (append), set arithmetic, if/when filter
# Scenario: Read IP list from file, ping each, log results to output file

name: Bulk IP Ping Test
description: Reads IPs from file and tests connectivity, logging results

vars:
  input_file: "C:\\Users\\me\\ip_list.txt"
  output_file: "C:\\Users\\me\\ping_results.txt"

steps:
  - print:
      message: "=== Bulk IP Ping Test ==="

  # Read list of IPs from file
  - readfile:
      path: "${input_file}"
      into: ip_list

  - if:
      condition: ip_list is empty
      then:
        - exit:
            status: failure
            message: "No IPs found in ${input_file}"
  - print:
      message: "Loaded ${ip_list.length} IPs to test"

  # Initialize counters
  - set:
      expression: success_count = 0
  - set:
      expression: fail_count = 0

  # Write header to output file
  - writefile:
      path: "${output_file}"
      content: "Ping Results - ${_timestamp}\n==============================\n"
      mode: overwrite

  # Process each IP
  - foreach:
      iterator: target_ip in ip_list
      do:
        - print:
            message: "Testing ${target_ip}..."

        - send:
            command: ping -c 1 -W 2 ${target_ip} 2>&1
            capture: ping_result
            on_error: continue

        - if:
            condition: ping_result contains "1 received" or ping_result contains "1 packets received"
            then:
              - set:
                  expression: status = "REACHABLE"
              - set:
                  expression: success_count = success_count + 1
            else:
              - set:
                  expression: status = "UNREACHABLE"
              - set:
                  expression: fail_count = fail_count + 1

        # Append result to file
        - writefile:
            path: "${output_file}"
            content: "${target_ip} - ${status}"
            mode: append

  # Write summary
  - writefile:
      path: "${output_file}"
      content: "\n==============================\nTotal: ${ip_list.length} | Success: ${success_count} | Failed: ${fail_count}"
      mode: append

  - print:
      message: "Results saved to ${output_file}"
  - print:
      message: "Success: ${success_count} | Failed: ${fail_count}"

  - exit:
      status: success
      message: "Ping test complete"
