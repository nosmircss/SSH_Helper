---
# Cisco IOS interface status check with detailed reporting

name: Cisco IOS Interface Status
description: Checks all interfaces and reports their status (up/down)

steps:
  - send:
      command: terminal length 0

  # Get interface brief
  - send:
      command: show ip interface brief
      capture: brief_output

  - print:
      message: "========== Interface Status Report =========="
  - print:
      message: ""

  # Extract all interfaces with their status
  # Pattern captures: interface name, IP, OK?, Method, Status, Protocol
  - extract:
      from: brief_output
      pattern: '^(\S+)\s+(\S+)\s+\S+\s+\S+\s+(\S+)\s+(\S+)'
      into: interfaces
      match: all

  # Count up and down interfaces
  - set:
      expression: up_count = 0
  - set:
      expression: down_count = 0

  # Process each line from the brief output
  - foreach:
      iterator: line in brief_output
      when: line matches '^\S+\s+\d'
      do:
        # Check if line indicates interface is up
        - if:
            condition: line matches '\s+up\s+up'
            then:
              - set:
                  expression: up_count = up_count + 1
            else:
              - if:
                  condition: line matches 'administratively down'
                  then:
                    - set:
                        expression: down_count = down_count + 1
                  else:
                    - if:
                        condition: line matches '\s+down\s'
                        then:
                          - set:
                              expression: down_count = down_count + 1

  - print:
      message: ""
  - print:
      message: "========== Summary =========="
  - print:
      message: "Interfaces UP: ${up_count}"
  - print:
      message: "Interfaces DOWN: ${down_count}"
  - print:
      message: "============================="

  - exit:
      status: success
      message: "Interface check complete"
