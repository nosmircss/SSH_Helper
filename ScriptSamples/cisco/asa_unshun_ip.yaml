---
# Converted from: dudescript/conversation/cisco/asa/pb_unshun
# Removes a shun (unblocks) an IP address on a Cisco ASA firewall
#
# Required variables (from CSV grid):
#   ${username} - ASA username
#   ${password} - ASA password
#   ${block}    - IP address to unshun

name: Cisco ASA Unshun IP
description: Removes shun (unblocks) an IP address on Cisco ASA

vars:
  block: ""

steps:
  # Login sequence
  - send:
      command: login
      expect: '/[Uu]sername:/'

  - send:
      command: ${username}
      expect: '/[Pp]assword: ?$/'

  - send:
      command: ${password}
      expect: '/# ?$/'

  # Check current shuns
  - send:
      command: sh shun
      capture: shun_list

  # Check if the IP is currently shunned
  - if:
      condition: shun_list matches 'shun.+?${block}'
      then:
        - print:
            message: "Found shun for ${block}, removing..."
        - send:
            command: no shun ${block}
        - print:
            message: "Unblocked ${block}"
      else:
        - print:
            message: "Shun not found for ${block}"

  # Show final state
  - send:
      command: sh shun
      capture: final_list

  - print:
      message: "Final shun list displayed above"

  - exit:
      status: success
      message: "Unshun operation complete"
