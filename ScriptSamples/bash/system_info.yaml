---
# Generic Linux system information gathering script

name: Linux System Info
description: Gathers basic system information from a Linux host

steps:
  # Get hostname
  - send:
      command: hostname
      capture: hostname

  - print:
      message: "========== System Info for ${hostname} =========="

  # Get OS info
  - send:
      command: cat /etc/os-release 2>/dev/null || cat /etc/redhat-release 2>/dev/null || uname -a
      capture: os_info

  - extract:
      from: os_info
      pattern: 'PRETTY_NAME="(.+?)"'
      into: os_name

  - if:
      condition: os_name is not empty
      then:
        - print:
            message: "OS: ${os_name}"
      else:
        - print:
            message: "OS: ${os_info}"

  # Get uptime
  - send:
      command: uptime
      capture: uptime_info

  - print:
      message: "Uptime: ${uptime_info}"

  # Get memory info
  - send:
      command: free -h | head -2
      capture: mem_info

  - print:
      message: "Memory:"
  - print:
      message: "${mem_info}"

  # Get disk usage
  - send:
      command: df -h / | tail -1
      capture: disk_info

  - extract:
      from: disk_info
      pattern: '(\d+%)'
      into: disk_percent

  - print:
      message: "Root disk usage: ${disk_percent}"

  # Get CPU info
  - send:
      command: grep "model name" /proc/cpuinfo | head -1
      capture: cpu_info

  - extract:
      from: cpu_info
      pattern: 'model name\s*:\s*(.+)$'
      into: cpu_model

  - print:
      message: "CPU: ${cpu_model}"

  # Get load average
  - send:
      command: cat /proc/loadavg
      capture: load_info

  - extract:
      from: load_info
      pattern: '^(\S+\s+\S+\s+\S+)'
      into: load_avg

  - print:
      message: "Load average: ${load_avg}"

  - print:
      message: "=========================================="

  - exit:
      status: success
      message: "System info gathered"
