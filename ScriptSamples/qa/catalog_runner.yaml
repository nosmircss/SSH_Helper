---
name: QA Coverage Fixture Import Runner
description: Fixture-backed executable QA sample for catalog coverage tests.
version: 1
environment: QA_CATALOG_ENV
imports:
  - path: "__QA_CATALOG_LIBRARY_PATH__"
    as: helper
steps:
  - send:
      command: echo fixture-send-expect
      expect: "\\$"
      capture: prompt_output
      on_error: continue
  - call:
      subroutine: helper.decorate
      args:
        prefix: "'fixture'"
        value: "'alpha'"
      out:
        result: final_value
  - print:
      message: "{{qa_missing_column_fixture}} => ${final_value}"
  - exit: success PASS - QA Coverage Fixture Import Runner
