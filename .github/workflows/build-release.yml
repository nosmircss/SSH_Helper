name: Build and Release SSH_Helper

on:
  push:
    #branches: [ "master" ]
    tags:
      - 'v*'
  #pull_request:
    #branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flowcanvas-browser-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install FlowCanvas dependencies
      working-directory: ./FlowCanvas
      run: npm ci

    - name: Install Playwright Chromium
      working-directory: ./FlowCanvas
      run: npx playwright install --with-deps chromium

    - name: Run FlowCanvas browser harness
      working-directory: ./FlowCanvas
      run: npm run test:e2e

    - name: Upload Playwright artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: FlowCanvas-Playwright
        path: |
          FlowCanvas/playwright-report/
          FlowCanvas/test-results/
        if-no-files-found: ignore

  build:
    needs: flowcanvas-browser-tests
    runs-on: windows-2022

    env:
      REBEX_LICENSE_KEY: ${{ secrets.REBEX_LICENSE_KEY }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install FlowCanvas dependencies
      working-directory: ./FlowCanvas
      run: npm ci

    - name: Restore dependencies
      run: dotnet restore ./SSH_Helper.csproj -r win-x64 /p:Configuration=Release

    - name: Publish standard build
      run: dotnet publish ./SSH_Helper.csproj -c Release -o ./publish/standard --no-restore

    - name: Publish portable build
      run: dotnet publish ./SSH_Helper.csproj -c Release -o ./publish/portable --no-restore -p:PortableBuild=true

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: SSH_Helper_Builds
        path: ./publish/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: SSH_Helper_Builds
        path: ./release

    - name: Stage release binaries
      run: |
        cp release/standard/SSH_Helper.exe release/SSH_Helper.exe
        cp release/portable/SSH_Helper_Portable.exe release/SSH_Helper_Portable.exe

    - name: Copy documentation to release
      run: |
        cp README.md release/
        cp SCRIPTING.md release/

    - name: Generate SHA256 checksums
      run: |
        cd release
        sha256sum SSH_Helper.exe > SSH_Helper.exe.sha256
        sha256sum SSH_Helper_Portable.exe > SSH_Helper_Portable.exe.sha256

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/SSH_Helper.exe
          release/SSH_Helper.exe.sha256
          release/SSH_Helper_Portable.exe
          release/SSH_Helper_Portable.exe.sha256
          release/README.md
          release/SCRIPTING.md
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
